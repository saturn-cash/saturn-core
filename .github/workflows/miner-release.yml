# Publishes Saturn Miner installers as a release of this repository.
#
# The app's source lives in saturn-cash/saturn-miner-v0.3.0; this workflow builds a pinned commit of it
# for Windows, macOS (Apple silicon + Intel) and Linux and attaches the installers to the release
# named below. To ship a new miner version: update MINER_REF and MINER_TAG, then push to a branch
# named release-miner-*.
name: miner-release

on:
  push:
    branches:
      - 'release-miner-*'

env:
  MINER_REPO: saturn-cash/saturn-miner-v0.3.0
  MINER_REF: 91ccadd813f592053c67470c1399eaa3e4834242 # Saturn 0.8.9
  MINER_TAG: miner-v0.8.9

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # both Mac builds run on an Intel runner: Apple silicon runners are often short on capacity
          - platform: macos-15-intel # Apple silicon (M1 and newer)
            args: --target aarch64-apple-darwin
          - platform: macos-15-intel # Intel Macs
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04 # .deb, .rpm and .AppImage
            args: ''
          - platform: windows-latest # .msi and setup .exe
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.MINER_REPO }}
          ref: ${{ env.MINER_REF }}
          path: miner

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: miner/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: miner/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-15-intel' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './miner/src-tauri -> target'

      - name: Install frontend dependencies
        working-directory: miner
        run: pnpm install --frozen-lockfile

      # Auto-update: when the repository has the TAURI_SIGNING_PRIVATE_KEY secret, the update files are
      # signed and latest.json (what installed apps read to find and check the newest version) is
      # published with the release. Without the secret the release still builds, just without them.
      - name: Sign updates when the signing key is set
        id: sign
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            node -e "const fs=require('fs'),f='miner/src-tauri/tauri.conf.json',c=JSON.parse(fs.readFileSync(f,'utf8'));c.bundle.createUpdaterArtifacts=true;fs.writeFileSync(f,JSON.stringify(c,null,2)+'\\n')"
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set, so this release has no auto-update files"
            echo "on=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: miner
          includeUpdaterJson: ${{ steps.sign.outputs.on }}
          updaterJsonPreferNsis: true
          tagName: ${{ env.MINER_TAG }}
          releaseName: 'Saturn v__VERSION__'
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            Saturn: the desktop miner, wallet and full node for the Saturn (SAT) network.

            **Download the installer for your computer:**
            - **Windows**: the `.msi` or `-setup.exe`
            - **Mac (M1/M2/M3/M4)**: the `aarch64.dmg`
            - **Mac (Intel)**: the `x64.dmg`
            - **Linux**: the `.AppImage` (any distro), `.deb` (Ubuntu/Debian) or `.rpm` (Fedora)

            **What's new in 0.8.9**
            - **Hyperspace intro.** The first time Saturn opens, and after every update, you get a green hologram trip: leave Earth in a little ship, jump to hyperspeed, and drop out at Saturn as the ship slips into orbit. Other launches keep the quick outline-Saturn intro. Click to skip either one.
            - Selected text now uses your computer's normal blue highlight.

            **New in 0.8.8**
            - **The power button keeps spinning.** Switch screens or hide the window and come back: the coin is still turning right where it would be, instead of starting its spin over.

            **New in 0.8.7**
            - **Hologram power button.** The Saturn coin is the power button now: grey and still when off, it lights up green and starts spinning when you mine. There's a little power button next to it too, like the sound one.
            - **Hologram flight map and peers radar** in the same green look.
            - **Rings.** 1 SAT = 100,000,000 rings, the smallest piece of a SAT. Your wallet shows both.
            - **Much lighter on your computer.** The space scene only runs at full speed while you mine or fly between screens, and slows right down in the background.
            - **Bitaxe that moved?** If your Bitaxe gets a new address (after a restart or a Wi-Fi change), Saturn finds it on your network and follows it. Errors now say what's actually wrong.
            - **Auto-update is built in.** From the next version on, Saturn tells you when an update is ready and installs it in one click, keeping your wallet and settings.

            **New in 0.8.6**
            - **Start button polish.** The little lamps under the glass now glow faintly in colour even when you're not mining, and the hover shine sweeps across the whole button.

            **New in 0.8.5**
            - **New start button.** Clear Windows Vista-style glass with little lamps under it: you can see the bulbs through the glass when it's off, and they light up in colour when you're mining. Hover for the Aero-blue glow.
            - **New icon.** The Saturn silhouette from saturn.boats, on a yellow tile, for the app, taskbar and dock, plus the boot screen.

            **New in 0.8.4**
            - **Saturn atmosphere switch.** The constant space drone, engine hum and solar wind are now their own switch in Settings, and they're off unless you turn them on. Share pings, block bells and warp sounds stay on the speaker button in the header.

            **New in 0.8.2**
            - **Stop always works.** You can now cancel mining while it still says "Starting…" (waiting on the pool, or on a node that's syncing or has no peers yet). Before, the button locked until work arrived.

            **New in 0.8.1**
            - **One living Saturn.** The Cassini photos are AI-upscaled 4x (7680 px) and Saturn now moves: the rings glint and drift, spokes pass over them, an aurora glows at the north pole as you mine, every share sends a ripple through the rings, and launches and found blocks cross into Saturn's shadow with the sun behind it. Flying between screens is one continuous camera move instead of a slideshow.
            - **Liquid-glass power button.** The reactor is now a rounded hexagon of frosted liquid glass, like an old indicator lamp: plain white while off, with coloured lamps glowing through the frost while mining. The dashed hexagon still turns around it, its highlight follows your pointer, and it squishes when you press it.

            **New in 0.8.0**
            - **Real Saturn.** The backgrounds are real photos of Saturn taken by NASA's Cassini spacecraft, with the live stars, comets, warp and block-found supernova on top. Each screen frames a different part of Saturn and flights pan and zoom across it. Prefer the 3D model? Settings → Real Saturn.
            - **Solo on my node.** A third mining mode with no pool at all: work comes straight from the Saturn Core node on your computer and any block you find goes straight to it.
            - **A new share ping**: short and bright. A mute button sits at the top left of every screen and on Mission control; Settings has Sound, Share ping and Block-found celebration switches. Muting keeps the animations; turning the celebration off keeps the bell.

            **New in 0.7.0**
            - **Run a full Saturn node.** Turn on "Saturn node on this computer" on the Network screen and the app downloads Saturn Core, checks it, and runs it: your own copy of the chain, real peers and blocks, and one more node keeping the network alive. It starts with Saturn and shuts down cleanly when you quit.
            - **Solo mining.** Pick Solo on the Mining screen: any block you find pays its whole reward straight to your address instead of being split with the pool.

            **New in 0.6.2**
            - **Multiple wallets.** Keep several, switch between them and rename them. Add one by creating it, restoring a recovery phrase, or importing it from Saturn Core, so the address your miner already pays can be spent here.
            - **Multiple addresses.** Each wallet hands out as many receive addresses as you like, and any of them can be your mining payout address.
            - **Bitaxe scan that finds it.** The scan now searches every network your computer can reach, not just the first adapter Windows reports, and tells you which networks it checked.

            **New in 0.6.1**
            - A new, minimal launch screen.

            **New in 0.6.0**
            - **Built-in wallet.** Create a wallet or restore one from a 12-word recovery phrase, see your balance and mining rewards as they mature, receive with a QR code, and send SAT. Transactions are signed on your computer; the recovery phrase never leaves it. No Saturn Core node needed.
            - New wallets automatically receive your mining payouts.
            - Export your wallet to Saturn Core whenever you want to run a full node.
            - The app is now simply **Saturn**, with a new white icon and its own title bar on Windows and Linux.

            **Start mining:** open Saturn, create a wallet on the Wallet screen, then press the hexagon on Mining. Pool: `stratum+tcp://pool.saturn.boats:3333`. Stats: https://pool.saturn.boats

            On a Mac the first launch needs right-click → Open, because the app isn't notarised yet.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
